# Apache virtual host for srv-console. Adapt the names and the certificate paths.
# Create the password file with:  htpasswd -c /etc/apache2/srv-console.htpasswd yourname

<VirtualHost *:80>
    ServerName console.example.com
    Redirect permanent / https://console.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName console.example.com
    DocumentRoot /opt/srv-console/public

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/console.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/console.example.com/privkey.pem

    <Directory /opt/srv-console/public>
        # Protects the page, the assets and the API: nothing is served without a login
        AuthType Basic
        AuthName "Console"
        AuthUserFile /etc/apache2/srv-console.htpasswd
        Require valid-user

        # Or keep it on your LAN only, no password:
        # Require ip 192.168.0.0/16
    </Directory>

    # A bare 401 instead of Apache's default text page
    ErrorDocument 401 "<!doctype html><title>401</title>"

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Cache-Control "no-store"
    Header always set X-Robots-Tag "noindex, nofollow"

    # PHP: whatever you already use for other sites (mod_php or php-fpm)
</VirtualHost>

# Also make sure a request that matches none of your virtual hosts (an IP address, an unknown
# name) cannot reach this folder. The first virtual host Apache loads answers those requests.
