# nginx server block for srv-console. Adapt the names, the certificate paths and the php-fpm socket.
# Create the password file with:  htpasswd -c /etc/nginx/srv-console.htpasswd yourname

server {
    listen 80;
    server_name console.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name console.example.com;
    root /opt/srv-console/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/console.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.com/privkey.pem;

    # Protects the page, the assets and the API: nothing is served without a login
    auth_basic           "Console";
    auth_basic_user_file /etc/nginx/srv-console.htpasswd;
    # Or keep it on your LAN only, no password:
    # allow 192.168.0.0/16;
    # deny  all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

# Also make sure a request that matches none of your server blocks (an IP address, an unknown
# name) cannot reach this folder: add a default_server that answers 444 or 403.
